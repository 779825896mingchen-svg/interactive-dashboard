<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #weekly-tasks {
            background-color: #accfb5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        #weekly-tasks form {
            margin-bottom: 15px;
        }
        
        #weekly-tasks label {
            font-weight: bold;
            margin-top: 10px;
        }
        
        #weekly-tasks input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        
        #goal-btn {
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #goal-btn:hover {
            background-color: #0050a5;
        }
        
        #goal-message {
            margin-top: 15px;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-size: 1.8em;
            font-weight: bold;
            color: #222222;
            font-family: 'Arial', sans-serif;

        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mt-4 text-center">Interactive Dashboard</h1>
        
        <div class="row">
            <div class="col" id="weekly-tasks">
                <h3 class="text-center">Weekly Goal Calculator</h3>
                
                <!-- HTML Form -->
                <form id="goal-form">
                    <div class="form-group">
                        <label for="user-name">Name:</label>
                        <input type="text" id="user-name" placeholder="Enter your name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="daily-goal">Daily Task Goal:</label>
                        <input type="number" id="daily-goal" placeholder="Enter daily tasks" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="bonus-tasks">Weekly Bonus Tasks:</label>
                        <input type="number" id="bonus-tasks" placeholder="Enter bonus tasks" min="0" required>
                    </div>
                    
                    <button type="submit" id="goal-btn">Calculate Goals</button>

                    <button type="button" id="reset-btn" style="margin-top:15px; margin-left:10px; background-color:#6c757d; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">Reset Form</button>
                </form>
                
                <!-- Output Area -->
                <p id="goal-message"></p>
                
                <!-- External JavaScript -->
                <script src="js/task-manager.js"></script>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
